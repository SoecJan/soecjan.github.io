@let state = playerInventoryState$ | async; @if (!!state) {
  <h3>Inventar - Geld: {{state.money}}€</h3>
  <ul>
    @for (productStorage of state.storageArray; track
    productStorage.product.name) {
    <li>
      {{ productStorage.amount }}
      {{ productStorage.product.name }}
    </li>
    }
  </ul>
}
